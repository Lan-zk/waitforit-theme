# waitforit-theme 英文文案（必需回退语言，CFG-23/CFG-24）
# 键统一 waitforit. 前缀；站点在自身 i18n/<lang>.toml 里写同名键即可覆盖。
# 模板缺键时渲染空串（CNT-18），所以每个键在中英文两边的集合必须一致。

[waitforit]
  hero = "He makes me lie down in green pastures\nhe leads me beside quiet waters"
  heroSource = "Psalms 23:2"
  skip = "Skip to content"

  [waitforit.nav]
    menu = "Menu"
    close = "Close"
    blog = "Blog"
    essays = "Essays"
    projects = "Projects"
    fiction = "Fiction"
    photography = "Photography"
    about = "About"

  [waitforit.theme]
    auto = "Auto"
    day = "Day"
    night = "Night"
    label = "Theme"

  [waitforit.lang]
    label = "Language"

  [waitforit.list]
    empty = "Nothing here yet."
    read = "Read all"

  [waitforit.projects]
    repo = "Repository"
    demo = "Demo"

  [waitforit.pagination]
    label = "Pagination"
    previous = "Previous page"
    next = "Next page"

  [waitforit.footer]
    brand = "Rest"

  [waitforit.404]
    title = "404"
    body = "This page has not been written."
    home = "Back to the start"

  [waitforit.code]
    text = "Text"
    copy = "Copy"
    success = "Copied."
    error = "Copy unavailable. Code selected; use your system copy command."

  [waitforit.tags]
    title = "Tags"
    all = "All tags"
    page = "Page"
