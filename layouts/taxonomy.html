{{ define "main" }}
<section class="wf-column wf-index">
  <h1 class="wf-entry-title">{{ .Title }}</h1>
  {{- if .Pages }}
  <ul class="wf-tag-index">
    {{- range .Pages.ByTitle }}
    <li><a href="{{ .RelPermalink }}">#{{ .LinkTitle }} <span class="wf-tag-index__count">({{ len .Pages }})</span></a></li>
    {{- end }}
  </ul>
  {{- else }}
  <p class="wf-empty">{{ T "waitforit.list.empty" }}</p>
  {{- end }}
  {{- with .Content }}<div class="wf-prose wf-index__intro">{{ . }}</div>{{ end }}
</section>
{{ end }}
