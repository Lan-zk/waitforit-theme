{{- /* 条目链接与标签互为兄弟，避免把标签链接嵌套在整行链接中。 */}}
<div class="wf-list-entry">
<a class="wf-post-row" href="{{ .RelPermalink }}">
  <span class="wf-post-row__date">{{ if not .Date.IsZero }}{{ .Date | time.Format ":date_long" }}{{ end }}</span>
  <span class="wf-post-row__title">{{ .Title }}{{ partial "star.html" (dict "class" "wf-post-row__star") }}</span>
</a>
{{ partial "tags.html" . }}
</div>
