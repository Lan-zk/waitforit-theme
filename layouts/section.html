{{ define "main" }}
<section class="wf-column wf-index">
  <h1 class="wf-sr-only">{{ .Title }}</h1>
  {{- $pages := .Pages.ByDate.Reverse }}
  {{- if $pages }}
  <div class="wf-index__list">
    {{- range $pages }}{{ partial "post-row.html" . }}{{ end }}
  </div>
  {{- else }}
  <p class="wf-empty">{{ T "waitforit.list.empty" }}</p>
  {{- end }}
  {{- with .Content }}<div class="wf-prose wf-index__intro">{{ . }}</div>{{ end }}
</section>
{{ end }}
