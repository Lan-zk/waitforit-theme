{{ define "main" }}
{{- $wf := site.Params.waitforit | default dict }}
{{- $hero := $wf.hero | default (T "waitforit.hero") }}
<section class="wf-hero" aria-labelledby="wf-hero-sentence">
  <h1 class="wf-hero__sentence" id="wf-hero-sentence">{{ $hero }}</h1>
  {{- if not $wf.hero }}<p class="wf-hero__source">{{ T "waitforit.heroSource" }}</p>{{ end }}
</section>
{{ end }}
