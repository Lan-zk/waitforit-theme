# waitforit-theme CI（OpenSpec theme-skeleton D10 / tasks 7.2）
# 双 Hugo 矩阵（最低支持 0.146.0 + 当前稳定 0.168.0）→ 门禁 → 零 WARN 构建 → 弃用审计。
# 依据：REL-01（不需要 extended）、REL-07（双版本矩阵）、REL-08（--panicOnWarning 抓不到 INFO 弃用）、REL-09（离线构建）。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (Hugo ${{ matrix.hugo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: ["0.146.0", "0.168.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 门禁脚本只用 Node 内置模块；版本与仓库基线一致（Node >= 22）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo }}
          extended: false

      - name: Show Hugo version
        run: hugo version

      - name: Asset and design-contract gates
        run: node scripts/check-assets.mjs

      # 构建命令与 design.md D10 逐字一致：WARN 即 panic（exit 2）。
      - name: Build exampleSite (warnings are fatal)
        run: |
          hugo --source exampleSite --themesDir ../.. \
            --panicOnWarning --printPathWarnings --printUnusedTemplates --printI18nWarnings \
            --gc --cleanDestinationDir

      # INFO 级弃用不受 --panicOnWarning 管控，必须单独跑 --logLevel info 再 grep（REL-05/REL-08）。
      - name: Deprecation audit
        run: |
          hugo --source exampleSite --themesDir ../.. --logLevel info 2>&1 | tee /tmp/hugo-info.log
          ! grep -qi deprecat /tmp/hugo-info.log
