# waitforit-theme CI
# 版本策略（D33）：固定当前稳定版 0.168.0 执行验收，另设每周对 latest 的构建与弃用审计；
# 只支持最新稳定版，不再维护 0.146.0 旧版矩阵。
# 依据：REL-01（不需要 extended）、REL-05/REL-08（INFO 级弃用需单独审计）、REL-09（离线构建）。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 对最新稳定版复跑，早于用户发现弃用或破坏性变更。
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  HUGO_VERSION: "0.168.0"

jobs:
  browser:
    name: browser and consumer variants
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: false

      # 中文fixture依赖系统CJK字体；缺字体时Chromium只画空白字形，页面高度和截图都与本地不一致。
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Show browser version
        run: google-chrome --version

      - name: Browser gates (software WebGL)
        env:
          WF_SOFTWARE_WEBGL: "1"
        run: node test/ci.mjs --out "${RUNNER_TEMP}/wf-browser-evidence"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/wf-browser-evidence
          if-no-files-found: warn

  build:
    name: build (Hugo 0.168.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 门禁脚本只用 Node 内置模块；版本与仓库基线一致（Node >= 22）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: false

      - name: Show Hugo version
        run: hugo version

      - name: Asset and design-contract gates
        run: node scripts/check-assets.mjs

      # 构建命令与 REL-07 一致：WARN 即 panic（exit 2）。
      - name: Build exampleSite (warnings are fatal)
        run: |
          hugo --source exampleSite --themesDir ../.. \
            --panicOnWarning --printPathWarnings --printUnusedTemplates --printI18nWarnings \
            --gc --cleanDestinationDir

      # INFO 级弃用不受 --panicOnWarning 管控，必须单独跑 --logLevel info 再 grep（REL-05/REL-08）。
      - name: Deprecation audit
        run: |
          hugo --source exampleSite --themesDir ../.. --logLevel info 2>&1 | tee /tmp/hugo-info.log
          ! grep -qi deprecat /tmp/hugo-info.log

  latest:
    name: build (Hugo latest)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Hugo (latest)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: false

      - name: Show Hugo version
        run: hugo version

      - name: Asset and design-contract gates
        run: node scripts/check-assets.mjs

      - name: Build exampleSite (warnings are fatal)
        run: |
          hugo --source exampleSite --themesDir ../.. \
            --panicOnWarning --printPathWarnings --printUnusedTemplates --printI18nWarnings \
            --gc --cleanDestinationDir

      - name: Deprecation audit
        run: |
          hugo --source exampleSite --themesDir ../.. --logLevel info 2>&1 | tee /tmp/hugo-info.log
          ! grep -qi deprecat /tmp/hugo-info.log
