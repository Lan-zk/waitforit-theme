# exampleSite：waitforit-theme 的可构建 fixture（虚构站点，D11）
# 同时演示站点侧契约：theme 名、双语、params 覆盖；刻意不声明 menus.main，
# 让主题内置的六类型导航与 placeholder 页在 fixture 中被实际构建（D33）。
#
# 语言展示名/代码走 [languages.<lang>.params]（label/locale），不写 languageName/languageCode/
# languageDirection：后三者在 Hugo 0.168 是弃用键（WARN → --panicOnWarning 失败）。
# locale 取 en / zh，让 <html lang> 与 hreflang 与 spec 场景的字面值一致。

baseURL = "https://example.com/"
title = "The Night Post"
theme = "waitforit-theme"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# 分页（TPL-20/21）：blog 文章多于 2 篇时生成 page/2，用于验收分页路径与上一页/下一页。
[pagination]
  pagerSize = 2

[params]
  description = "A fictional personal site for writing, notes, and projects."

  [params.waitforit]
    defaultTheme = "auto"
    [params.waitforit.features]
      scene = true
      transitions = true

[languages]
  [languages.en]
    weight = 1
    title = "The Night Post"
    [languages.en.params]
      label = "English"
      locale = "en"
      description = "A fictional personal site for writing, notes, and projects."

  [languages.zh]
    weight = 2
    title = "夜邮"
    [languages.zh.params]
      label = "中文"
      locale = "zh"
      description = "一个虚构的个人站点，收长文、短记与作品。"
    [languages.zh.params.waitforit]
